# Synthetic demo tenant: drugstore chain. All names and addresses are fictitious.
schema_version: 1
tenant_id: drogeriewelt
display_name: Drogeriewelt (synthetic)
business: German drugstore chain buying cosmetics, health and household products.
language: de
correspondence_languages: [de]
currency: EUR

# Initial tiers from the Phase 0 smoke test (both accept image input).
models:
  tiers:
    small: {deployment: small, model: gpt-5.4-mini, vision: true}
    strong: {deployment: strong, model: gpt-5.5, vision: true, fallback: small}
  roles:
    extractor: strong
    compliance_explainer: small
    line_matcher: small
    investigator: strong
    resolution_planner: strong
    correspondence_writer: small
    fact_check_wording: small
    baseline_agent: strong
  embedding: {deployment: embed, model: text-embedding-3-large}

mandatory_fields:
  - order_reference
  - lines[].gtin
  - lines[].batch_number
  - lines[].best_before_date

tolerances:
  quantity: {relative: 0, absolute: 0}
  unit_price: {relative: 0, absolute: 0}
  rounding_eur: 0.01

shelf_life:
  min_remaining_days: 180

actions:
  - approve
  - short_pay
  - request_credit_note
  - reject_compliance
  - hold_for_goods_receipt
  - escalate

# Every discrepancy goes to a human; only fully clean invoices are touchless.
auto_approval:
  clean_invoices: true
  within_tolerance: false
  max_invoice_gross_eur: 3000

reviewers:
  - {reviewer_id: ap.lead, display_name: Kreditorenbuchhaltung Leitung, email: ap-lead@drogeriewelt.example}
  - {reviewer_id: category.mgmt, display_name: Category Management, email: category@drogeriewelt.example}

budget:
  daily_token_limit: 1000000
  daily_cost_limit_eur: 1.00
