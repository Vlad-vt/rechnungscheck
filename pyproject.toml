[project]
name = "rechnungscheck"
version = "0.1.0"
description = "Multi-tenant e-invoice reconciliation agents on Azure (portfolio project, synthetic data only)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pillow>=13.0.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.1",
    "pypdfium2>=5.15.2",
    "pyyaml>=6.0.4",
    "rich>=15.0.0",
    "typer>=0.29.2",
]

[project.scripts]
rechnungscheck = "rechnungscheck.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rechnungscheck", "datagen"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "datagen", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "PT", "PL", "TRY", "DTZ", "ANN",
]
ignore = [
  "PLR0913",  # pydantic models and agent factories legitimately take many arguments
  "TRY003",   # descriptive exception messages are fine
]

[tool.ruff.lint.isort]
known-first-party = ["rechnungscheck", "datagen", "evals"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "PLR2004", "ANN"]
"scripts/**" = ["PLR2004", "ANN401"]  # one-off operational scripts
# Synthetic data generator: seeded PRNG by design, long document builders are flat sequences.
"datagen/**" = ["S311", "PLR0911", "PLR0912", "PLR0915", "PLR0917", "PLR2004"]
"datagen/contracts.py" = ["E501"]  # contract prose
"evals/**" = ["S607", "PLR2004", "PLR0915", "E501"]  # runners call docker/git by name; embedded shell

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "datagen", "evals", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: needs local services (Docker Compose)",
  "cloud: needs Azure access; never runs in ci.yml",
]

[dependency-groups]
datagen = [
    "factur-x>=7.10",
    "reportlab>=5.1.0",
]
dev = [
    "lxml-stubs>=0.5.1",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261122",
]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["reportlab.*", "facturx.*", "pypdfium2.*"]
ignore_missing_imports = true

[tool.uv]
default-groups = ["dev", "datagen"]
